<mat-toolbar class="top-bar">
  <span class="brand">DevConnect<span class="cursor" aria-hidden="true">_</span></span>

  <span class="spacer"></span>

  <button
    matIconButton
    type="button"
    [attr.aria-label]="theme.dark() ? 'Use light theme' : 'Use dark theme'"
    (click)="theme.toggle()"
  >
    <mat-icon>{{ theme.dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>

<main class="content">
  <router-outlet />
</main>
